<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanMate - 회원가입</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-page">

    <section class="auth-visual">

        <div class="brand">
            <div class="brand-icon">📘</div>
            <span>PlanMate</span>
        </div>

        <div class="visual-content">
            <p class="visual-label">START YOUR PLAN</p>

            <h1>
                나만의 학습 계획을<br>
                지금 시작해보세요.
            </h1>

            <p>
                공부 일정과 기록을 관리하고<br>
                목표 달성 현황을 한눈에 확인할 수 있습니다.
            </p>
        </div>

        <div class="visual-card">
            <span>PlanMate와 함께</span>
            <strong>계획부터 기록까지 차근차근 관리해보세요.</strong>
        </div>

    </section>

    <section class="auth-form-section">

        <div class="auth-card signup-card">

            <div class="mobile-brand">
                📘 PlanMate
            </div>

            <div class="auth-header">
                <p class="auth-label">CREATE ACCOUNT</p>
                <h2>회원가입</h2>
                <p>학습 관리를 시작하기 위한 정보를 입력해주세요.</p>
            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="loginId">아이디</label>

                    <input
                            type="text"
                            id="loginId"
                            name="loginId"
                            placeholder="사용할 아이디를 입력하세요"
                            autocomplete="username"
                            required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="new-password"
                            required>
                </div>

                <div class="form-group">
                    <label for="name">이름</label>

                    <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="이름을 입력하세요"
                            autocomplete="name"
                            required>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@planmate.com"
                            autocomplete="email"
                            required>
                </div>

                <div class="form-group">
                    <label for="secondPassword">
                        2차 비밀번호
                    </label>

                    <input
                            type="password"
                            id="secondPassword"
                            name="secondPassword"
                            placeholder="계정 잠금 해제용 비밀번호"
                            autocomplete="new-password"
                            required>

                    <p class="input-help">
                        로그인 실패로 계정이 잠겼을 때 사용합니다.
                    </p>
                </div>

                <p
                        id="signupMessage"
                        class="form-message">
                </p>

                <button
                        type="submit"
                        class="auth-submit-button"
                        id="signupButton">
                    가입하기
                </button>

            </form>

            <div class="auth-links">
                <span class="link-description">
                    이미 계정이 있나요?
                </span>

                <a th:href="@{/login}">
                    로그인
                </a>
            </div>

        </div>

    </section>

</div>

<script>
    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const signupMessage = document.getElementById("signupMessage");

    signupForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        signupMessage.textContent = "";
        signupMessage.className = "form-message";

        signupButton.disabled = true;
        signupButton.textContent = "가입 처리 중...";

        const formData = new URLSearchParams();

        formData.append(
            "loginId",
            document.getElementById("loginId").value.trim()
        );

        formData.append(
            "password",
            document.getElementById("password").value
        );

        formData.append(
            "name",
            document.getElementById("name").value.trim()
        );

        formData.append(
            "email",
            document.getElementById("email").value.trim()
        );

        formData.append(
            "secondPassword",
            document.getElementById("secondPassword").value
        );

        try {
            const response = await fetch("/api/user/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            });

            const result = await response.text();

            if (
                result.includes("회원가입이 완료") ||
                result.includes("회원가입 완료") ||
                result.includes("가입이 완료")
            ) {
                signupMessage.textContent =
                    "회원가입이 완료되었습니다. 로그인 화면으로 이동합니다.";

                signupMessage.classList.add("success-message");

                setTimeout(function () {
                    window.location.href = "/login";
                }, 1000);

                return;
            }

            signupMessage.textContent = result;
            signupMessage.classList.add("error-message");

        } catch (error) {
            console.error(error);

            signupMessage.textContent =
                "서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";

            signupMessage.classList.add("error-message");

        } finally {
            signupButton.disabled = false;
            signupButton.textContent = "가입하기";
        }
    });
</script>

</body>
</html>
