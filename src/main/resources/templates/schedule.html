<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>PlanMate - 일정 관리</title>

  <!-- 공통 레이아웃 CSS -->
  <link
          rel="stylesheet"
          th:href="@{/css/dashboard.css}">

  <!-- 일정 관리 전용 CSS -->
  <link
          rel="stylesheet"
          th:href="@{/css/schedule.css}">
</head>

<body>

<!-- 공통 Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Sidebar + 본문 -->
<div class="site-layout">

  <!-- 공통 Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- 일정 관리 본문 -->
  <main class="page schedule-page">

    <!-- 페이지 제목 -->
    <header class="page-title">

      <div>
        <p class="section-label">
          SCHEDULE
        </p>

        <h2>
          공부 일정 관리
        </h2>

        <p class="page-description">
          과목과 공부 일정을 등록하고
          캘린더에서 확인할 수 있습니다.
        </p>
      </div>

      <button
              type="button"
              class="primary-button"
              id="openScheduleFormBtn">
        + 일정 등록
      </button>

    </header>

    <!-- 과목 관리 / 캘린더 / 일정 폼 -->
    <div class="schedule-layout">

      <!-- 과목 관리 -->
      <section class="card subject-panel">

        <div class="panel-header">
          <h3>
            과목 관리
          </h3>
        </div>

        <!-- JS로 과목 목록 출력 -->
        <ul
                id="subjectList"
                class="subject-list">
        </ul>

        <!-- 과목 등록·수정 폼 -->
        <div class="subject-form">

          <div class="form-group">

            <label for="subjectName">
              과목명
            </label>

            <input
                    id="subjectName"
                    type="text"
                    placeholder="과목명을 입력하세요"
                    autocomplete="off">

          </div>

          <div class="form-group">

            <label for="subjectColor">
              과목 색상
            </label>

            <input
                    id="subjectColor"
                    type="color"
                    value="#6b7280">

          </div>

          <div class="button-row">

            <button
                    type="button"
                    id="addSubjectBtn"
                    class="primary-button">
              추가
            </button>

            <button
                    type="button"
                    id="updateSubjectBtn"
                    class="secondary-button">
              수정
            </button>

            <button
                    type="button"
                    id="deleteSubjectBtn"
                    class="danger-button">
              삭제
            </button>

          </div>

        </div>

      </section>

      <!-- 캘린더 -->
      <section class="card calendar-panel">

        <div class="calendar-header">

          <button
                  type="button"
                  id="prevMonthBtn"
                  class="calendar-navigation-button"
                  aria-label="이전 달">
            &lt;
          </button>

          <h3 id="calendarTitle">
            2026년 8월
          </h3>

          <button
                  type="button"
                  id="nextMonthBtn"
                  class="calendar-navigation-button"
                  aria-label="다음 달">
            &gt;
          </button>

        </div>

        <!-- 요일 -->
        <div class="calendar-grid weekday">

          <div class="sunday">
            일
          </div>

          <div>
            월
          </div>

          <div>
            화
          </div>

          <div>
            수
          </div>

          <div>
            목
          </div>

          <div>
            금
          </div>

          <div class="saturday">
            토
          </div>

        </div>

        <!--
            schedule.js에서 날짜와 일정을 생성함.
            일정 HTML 권장 구조:

            <button class="schedule-item" title="전체 일정 제목">
                <span class="schedule-item-time">11:30</span>
                <span class="schedule-item-title">자바 강의</span>
            </button>
        -->
        <div
                id="calendarDates"
                class="calendar-grid dates">
        </div>

      </section>

      <!-- 일정 등록·수정 폼 -->
      <section class="card schedule-form-panel">

        <div class="panel-header">

          <h3 id="scheduleFormTitle">
            일정 등록 / 수정
          </h3>

        </div>

        <form
                id="scheduleForm"
                autocomplete="off">

          <div class="form-group">

            <label for="subject">
              과목
            </label>

            <select id="subject">
              <option value="">
                과목을 선택하세요
              </option>
            </select>

          </div>

          <div class="form-group">

            <label for="title">
              일정 제목
            </label>

            <input
                    id="title"
                    type="text"
                    maxlength="100"
                    placeholder="예: 영어 단어 암기">

          </div>

          <div class="form-group">

            <label for="date">
              날짜
            </label>

            <input
                    id="date"
                    type="date">

          </div>

          <div class="time-input-row">

            <div class="form-group">

              <label for="startTime">
                시작 시간
              </label>

              <input
                      id="startTime"
                      type="time">

            </div>

            <div class="form-group">

              <label for="endTime">
                종료 시간
              </label>

              <input
                      id="endTime"
                      type="time">

            </div>

          </div>

          <div class="form-group">

            <label for="memo">
              메모
            </label>

            <textarea
                    id="memo"
                    maxlength="500"
                    placeholder="메모를 입력하세요"></textarea>

          </div>

          <div class="form-group">

            <label for="status">
              상태
            </label>

            <select id="status">

              <option value="예정">
                예정
              </option>

              <option value="완료">
                완료
              </option>

            </select>

          </div>

          <div class="button-row schedule-button-row">

            <button
                    type="button"
                    id="addScheduleBtn"
                    class="primary-button">
              등록
            </button>

            <button
                    type="button"
                    id="updateScheduleBtn"
                    class="secondary-button">
              수정
            </button>

            <button
                    type="button"
                    id="deleteScheduleBtn"
                    class="danger-button">
              삭제
            </button>

          </div>

        </form>

      </section>

    </div>

  </main>

</div>

<!-- 공통 Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- 일정 관리 기능 -->
<script th:src="@{/js/schedule.js}"></script>

<!-- 로그아웃 기능 -->
<script th:replace="~{fragments/header :: logoutScript}"></script>

</body>
</html>
