<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanMate - 로그인</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-page">

    <section class="auth-visual">

        <div class="brand">
            <div class="brand-icon">📘</div>
            <span>PlanMate</span>
        </div>

        <div class="visual-content">
            <p class="visual-label">PLAN YOUR STUDY</p>

            <h1>
                오늘의 공부를<br>
                더 체계적으로 관리하세요.
            </h1>

            <p>
                학습 일정, 공부 기록, 목표 달성률을<br>
                한 곳에서 확인할 수 있습니다.
            </p>
        </div>

        <div class="visual-card">
            <span>오늘의 한마디</span>
            <strong>작은 기록이 꾸준한 성장을 만듭니다.</strong>
        </div>

    </section>

    <section class="auth-form-section">

        <div class="auth-card">

            <div class="mobile-brand">
                📘 PlanMate
            </div>

            <div class="auth-header">
                <p class="auth-label">WELCOME BACK</p>
                <h2>로그인</h2>
                <p>PlanMate에 로그인하고 학습을 시작해보세요.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginId">아이디</label>

                    <input
                            type="text"
                            id="loginId"
                            placeholder="아이디를 입력하세요"
                            autocomplete="username"
                            required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>

                    <input
                            type="password"
                            id="password"
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="current-password"
                            required>
                </div>

                <p
                        id="loginMessage"
                        class="form-message">
                </p>

                <button
                        type="submit"
                        class="auth-submit-button"
                        id="loginButton">
                    로그인
                </button>

            </form>

            <div class="auth-links">

                <a th:href="@{/signup}">
                    회원가입
                </a>

                <span></span>

                <a th:href="@{/unlock}">
                    계정 잠금 해제
                </a>

            </div>

        </div>

    </section>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const loginId = document.getElementById("loginId").value.trim();
        const password = document.getElementById("password").value;

        loginMessage.textContent = "";
        loginMessage.className = "form-message";

        loginButton.disabled = true;
        loginButton.textContent = "로그인 중...";

        const body = new URLSearchParams();
        body.append("loginId", loginId);
        body.append("password", password);

        try {
            const response = await fetch("/api/user/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: body.toString()
            });

            const result = await response.text();

            if (
                result.includes("로그인 성공") ||
                result.includes("성공")
            ) {
                window.location.href = "/dashboard";
                return;
            }

            if (
                result.includes("5회 오류") ||
                result.includes("잠겼습니다") ||
                result.includes("잠금")
            ) {
                loginMessage.textContent =
                    result + " 잠금 해제 화면으로 이동합니다.";

                loginMessage.classList.add("error-message");

                setTimeout(function () {
                    window.location.href = "/unlock";
                }, 1200);

                return;
            }

            loginMessage.textContent = result;
            loginMessage.classList.add("error-message");

        } catch (error) {
            console.error(error);

            loginMessage.textContent =
                "서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";

            loginMessage.classList.add("error-message");

        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "로그인";
        }
    });
</script>

</body>
</html>
