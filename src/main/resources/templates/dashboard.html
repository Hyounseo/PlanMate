<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanMate Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">
        <div>
            <p class="header-label">PLANMATE</p>
            <h1>나의 학습 대시보드</h1>
            <p class="header-description">
                오늘의 학습 현황을 확인하고 목표를 달성해보세요.
            </p>
        </div>

        <div class="profile">
            <div class="profile-icon">👩‍💻</div>

            <div>
                <strong>다은님</strong>
                <p>오늘도 파이팅!</p>
            </div>
        </div>
    </header>

    <main>

        <!-- 상단 요약 카드 -->
        <section class="summary-grid">

            <article class="summary-card">
                <div class="card-icon">⏱️</div>

                <div>
                    <p class="card-title">총 공부시간</p>
                    <p class="card-value" id="totalStudyTime">0시간</p>
                    <p class="card-caption">오늘의 누적 공부시간</p>
                </div>
            </article>

            <article class="summary-card">
                <div class="card-icon">📅</div>

                <div>
                    <p class="card-title">목표일까지</p>

                    <p class="card-value">
                        D-<span id="dday" th:text="${dDay}">0</span>
                    </p>

                    <p class="card-caption">목표일까지 남은 기간</p>
                </div>
            </article>

            <article class="summary-card">
                <div class="card-icon">🎯</div>

                <div>
                    <p class="card-title">목표 달성률</p>

                    <p class="card-value">
                        <span
                                id="achievementRate"
                                th:text="${achievementRate}">
                            0
                        </span>%
                    </p>

                    <p class="card-caption">오늘 목표 기준</p>
                </div>
            </article>

        </section>

        <!-- 목표 달성률 -->
        <section class="content-card">

            <div class="section-header">
                <div>
                    <p class="section-label">GOAL</p>
                    <h2>오늘의 목표 달성률</h2>
                </div>

                <strong
                        class="rate-text"
                        th:text="|${achievementRate}%|">
                    0%
                </strong>
            </div>

            <div class="progress-background">
                <div
                        class="progress-bar"
                        th:style="|width: ${achievementRate}%|">
                </div>
            </div>

        </section>

        <!-- 하단 -->
        <section class="bottom-grid">

            <article class="content-card">

                <div class="section-header">
                    <div>
                        <p class="section-label">SUBJECT</p>
                        <h2>과목별 공부 비율</h2>
                    </div>
                </div>

                <ul id="subjectRatio" class="subject-list">

                    <li class="empty-message">
                        공부 기록이 등록되면 표시됩니다.
                    </li>

                </ul>

            </article>

            <article class="recommendation-card">

                <div class="recommendation-icon">✨</div>

                <div>
                    <p class="section-label">AI RECOMMENDATION</p>
                    <h2>오늘의 학습 추천</h2>

                    <p
                            id="recommendation"
                            class="recommendation-text"
                            th:text="${recommendation}">
                        추천 결과가 없습니다.
                    </p>
                </div>

            </article>

        </section>

    </main>

</div>

</body>
</html>
