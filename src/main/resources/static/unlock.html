<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2차 비밀번호 인증</title>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .unlock-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #d9534f;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .unlock-btn {
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .unlock-btn:hover {
            background-color: #c9302c;
        }

    </style>
</head>


<body>

<div class="unlock-container">

    <h2>🔒 잠금 해제</h2>

    <form action="/api/user/unlock" method="post">

        <div class="input-group">
            <label>아이디</label>
            <input
                    type="text"
                    name="loginId"
                    placeholder="아이디 입력"
                    required>
        </div>


        <div class="input-group">
            <label>2차 비밀번호</label>
            <input
                    type="password"
                    name="secondPassword"
                    placeholder="2차 비밀번호 입력"
                    required>
        </div>


        <button type="submit" class="unlock-btn">
            인증하고 로그인
        </button>

    </form>

</div>

</body>
</html>
