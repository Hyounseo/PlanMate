<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h2>회원가입</h2>
<!-- 버튼을 누르면 우리가 짠 UserController의 /api/user/signup 으로 날아갑니다! -->
<form action="/api/user/signup" method="post">
    <div><label>아이디:</label> <input type="text" name="loginId" required></div> <br>
    <div><label>비밀번호:</label> <input type="password" name="password" required></div> <br>
    <div><label>이름:</label> <input type="text" name="name" required></div> <br>
    <div><label>이메일:</label> <input type="email" name="email" required></div> <br>
    <div><label>2차 비밀번호(잠금 해제용):</label> <input type="password" name="secondPassword" required></div> <br>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
